name: ci

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  docker-build:
    name: docker-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            APP_VERSION=0.0.0-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: |
          bash scripts/install-docs-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: bash scripts/build-docs.sh

  scripts:
    name: scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: shellcheck scripts/*.sh
      - run: bash scripts/test-next-version.sh
      - name: source-branch check self-test
        run: |
          HEAD_REF=develop HEAD_REPO=a/b BASE_REPO=a/b bash scripts/check-source-branch.sh
          if HEAD_REF=develop HEAD_REPO=fork/b BASE_REPO=a/b bash scripts/check-source-branch.sh; then
            echo "fork PR was accepted"; exit 1
          fi

  source-branch:
    name: source-branch
    if: github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: bash scripts/check-source-branch.sh

  release-preview:
    name: release-preview
    if: github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - id: v
        env:
          BRANCH: main
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: bash scripts/next-version.sh
      - run: |
          {
            echo "### Release preview"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Bump | \`${{ steps.v.outputs.bump }}\` |"
            echo "| Version | \`${{ steps.v.outputs.version }}\` |"
            echo "| Tag | \`${{ steps.v.outputs.tag }}\` |"
            echo "| Will release | \`${{ steps.v.outputs.release }}\` |"
            echo "| Previous | \`${{ steps.v.outputs.previous }}\` |"
            echo ""
            echo "Change the bump with a \`major\`, \`minor\` or \`patch\` label, or \`[major]\` / \`[minor]\` in the title."
          } >> "$GITHUB_STEP_SUMMARY"
